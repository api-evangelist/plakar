aid: plakar
name: Plakar
description: >-
  Plakar is an open-source, end-to-end encrypted, deduplicated backup and restore
  platform powered by Kloset, an immutable data store engine. It encrypts and
  deduplicates data at the source before it leaves your system (encryption keys stay
  in your own secret manager), stores it in a non-proprietary format on S3-compatible,
  cloud, or local backends, and supports immutable object-lock backups for zero-trust
  data protection. Plakar ships a CLI and built-in web UI, an official Go SDK
  (go-kloset-sdk), and a proto3 gRPC connector protocol for building custom importers,
  exporters, and storage backends. Sources include PostgreSQL, MySQL/MariaDB,
  Kubernetes, Proxmox, VMware vSphere, S3, SFTP, and many cloud drives. The commercial
  self-hosted Plakar Control Plane adds organization-wide scheduling, SLA management,
  and centralized administration. Backed by Seedcamp.
